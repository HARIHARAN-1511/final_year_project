<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDRDSS — Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            padding: 2rem;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #38bdf8;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 1rem;
        }

        .back-link:hover {
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background-color: #1e293b;
            padding: 1.5rem;
            border-radius: 0.5rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .chart-wrapper {
            background-color: #1e293b;
            padding: 1.5rem;
            border-radius: 0.5rem;
            height: 400px;
        }

        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>
                System Analytics
                <a href="/dashboard" class="back-link">&larr; Dashboard</a>
            </h1>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalAnalyses">-</div>
                <div class="stat-label">Total Analyses</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="highPriority">-</div>
                <div class="stat-label">High Priority Alerts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="criticalRate">-</div>
                <div class="stat-label">Critical Rate</div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-wrapper">
                <canvas id="severityChart"></canvas>
            </div>
            <!-- Placeholder for future timeframe chart -->
            <div class="chart-wrapper"
                style="display: flex; align-items: center; justify-content: center; color: #64748b;">
                More metrics coming soon...
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/analytics.js"></script>
</body>

</html>
